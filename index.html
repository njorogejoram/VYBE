<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101116">
<title>VYBE 5.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>VYBE.</h1>
  <form id="sf"><input id="q" type="search" placeholder="Search songs, artists, albums" aria-label="Search music"><button>Search</button></form>
</header>
<main>
  <section id="home" class="view on">
    <h2>Popular artists</h2><div id="chart" class="row"></div>
    <h2>Find your mood</h2>
    <div class="chips">
      <button data-q="night drive playlist">Night drive</button>
      <button data-q="deep focus music">Deep focus</button>
      <button data-q="slow chill songs">Slow down</button>
      <button data-q="high energy workout songs">High energy</button>
      <button data-q="afrobeats hits">Afrobeats</button>
      <button data-q="r&b hits">R&amp;B</button>
    </div>
  </section>
  <section id="explore" class="view">
    <div id="keybox" class="box" hidden>
      <b>Connect YouTube search</b>
      <p>Paste a YouTube Data API v3 key from Google Cloud Console. It is saved only in this browser.</p>
      <form id="kf"><input id="key" placeholder="API key"><button>Save key</button></form>
    </div>
    <p id="msg" class="muted"></p>
    <div id="artistsHit" class="row"></div>
    <div id="albumsHit" class="row"></div>
    <div id="songs"></div>
  </section>
  <section id="artists" class="view"><h2>Artists</h2><div id="artistGrid" class="grid"></div></section>
  <section id="library" class="view">
    <h2>Liked songs</h2><div id="liked"></div>
    <h2>On this device</h2>
    <label class="btn">Add music<input id="file" type="file" accept="audio/*" multiple hidden></label>
    <div id="local"></div>
  </section>
</main>
<div id="stage"><div id="yt"></div></div>
<div id="bar">
  <img id="art" alt="">
  <div class="meta"><b id="t">Choose a track</b><small id="s">Search to start listening</small></div>
  <div class="ctl">
    <button id="shuf" title="Shuffle">⤨</button><button id="prev" title="Previous">⏮</button>
    <button id="pp" title="Play or pause">▶</button><button id="next" title="Next">⏭</button>
    <button id="like" title="Like">♡</button>
  </div>
  <div class="seek"><span id="cu">0:00</span><input id="sk" type="range" min="0" max="100" value="0"><span id="du">0:00</span></div>
</div>
<nav>
  <button data-v="home" class="on">Home</button><button data-v="explore">Explore</button>
  <button data-v="artists">Artists</button><button data-v="library">Library</button>
</nav>
<script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
