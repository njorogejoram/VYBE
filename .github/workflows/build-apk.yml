name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Prepare web folder
        run: mkdir -p www && cp index.html style.css app.js www/
      - name: Create Android project
        run: npx cap add android
      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx --yes @capacitor/assets@3 generate --android
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VYBE-6.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VYBE-apk
          path: VYBE-6.5.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.5
          name: VYBE 6.5
          files: VYBE-6.5.apk
          make_latest: true
